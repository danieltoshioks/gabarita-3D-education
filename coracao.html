function Sl(a,b,y){const th=Math.atan2(b,a),ro=Math.hypot(a,b),s=Math.sqrt(Math.max(0,1-y*y)),k=.66+.34*(y+1)/2;
 const r=1-.055*gs(th,TA,.15)*s-.045*gs(th,TA+PI+.25,.2)*s+.06*gs(th,TA+1.3,.8)*Math.max(0,y+.4)*s;
 return [.8*k*s*r*ro*Math.cos(th),.95*(y<.45?y:.45+(y-.45)*.5),(Math.sin(th)<0?.56:.64)*k*s*r*ro*Math.sin(th)];}
