<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Modelos visuais · Gabarita PAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Jost:wght@500..800&display=swap">
<style>
:root{--bg:#060A1B;--pn:#0C132B;--ln:rgba(255,255,255,.09);--tx:#E9ECF7;--mu:#98A1BF;--am:#FFC928}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:40px 20px 64px}
h1{font:700 clamp(32px,5vw,48px)/1.05 Jost,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.intro{color:#C5CBE0;max-width:60ch;margin:0 0 22px}
.et{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 30px}
.et button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:600 13.5px Inter;cursor:pointer}
.et button[aria-pressed=true]{background:var(--am);color:#1B1500;border-color:var(--am)}
h2{font:600 22px Jost,sans-serif;margin:30px 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
a.c{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--pn);border:1px solid var(--ln);color:inherit;text-decoration:none;transition:transform .25s,border-color .25s}
a.c:hover{transform:translateY(-3px);border-color:rgba(255,201,40,.5)}a.c:focus-visible{outline:2px solid var(--am);outline-offset:3px}
a.c img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0A1028}
a.c div{padding:14px 16px 16px}a.c b{font:600 18px Jost,sans-serif;display:block}a.c p{margin:4px 0 8px;color:#B7BED6;font-size:13.5px}
a.c small{color:var(--mu);font-size:12px}
</style></head><body><div class="w">
<h1>Modelos visuais</h1>
<p class="intro">Conteúdos do PAS que ficam mais fáceis quando dá para ver de verdade. Gire, aproxime e toque numa parte para entender o que ela faz e como costuma cair na prova.</p>
<div class="et" id="et"></div><div id="lista"></div></div>
<script src="catalogo.js"></script>
<script>
// Open-source standalone mode enabled

let et=0;const box=document.getElementById("lista"),eb=document.getElementById("et");
[["Todas",0],["PAS 1",1],["PAS 2",2],["PAS 3",3]].forEach(([n,v])=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.onclick=()=>{et=v;pinta();};b.dataset.v=v;eb.appendChild(b);});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function pinta(){eb.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===et));
 box.innerHTML=GP_MODELOS_MAT.map(m=>{const it=GP_MODELOS_CAT.filter(x=>x.m===m&&(!et||x.pas.includes(et)));if(!it.length)return"";
  return `<h2 id="${m.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()}">${m}</h2><div class="g">${it.map(x=>`<a class="c" href="${x.id}.html"><img src="thumbs/${x.id}.jpg" alt="" loading="lazy"><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p><small>${x.pas.map(p=>"PAS "+p).join(" · ")}</small></div></a>`).join("")}</div>`;}).join("");
 if(location.hash){const a=document.getElementById(location.hash.slice(1));if(a)a.scrollIntoView();}}
pinta();
</script></body></html>
