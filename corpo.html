<script>
// titulo:"Corpo humano"
// Corpo humano: visão geral + 12 sistemas. O corpo está de frente (+z); o lado direito do corpo fica à esquerda de quem olha (−x).
const PI=Math.PI;
const SIS=[
 ["geral","Corpo inteiro",[.80,.80,.86]],
 ["esqueletico","Sistema esquelético",[.92,.88,.78]],["muscular","Sistema muscular",[.78,.30,.28]],["nervoso","Sistema nervoso",[.96,.80,.40]],
 ["circulatorio","Sistema circulatório",[.86,.24,.22]],["respiratorio","Sistema respiratório",[.92,.62,.66]],["digestorio","Sistema digestório",[.94,.66,.46]],
 ["urinario","Sistema urinário",[.66,.36,.34]],["endocrino","Sistema endócrino",[.66,.56,.92]],["linfatico","Sistema linfático e imune",[.48,.80,.58]],
 ["masculino","Sistema genital masculino",[.52,.64,.92]],["feminino","Sistema genital feminino",[.94,.56,.72]],["tegumentar","Pele (sistema tegumentar)",[.94,.78,.66]],
];
const S=(()=>{const h=location.hash.slice(1).split("-").filter(x=>x&&x!=="teste");return SIS.some(s=>s[0]===h[0])?h[0]:"geral";})();
const IDX=SIS.findIndex(s=>s[0]===S);
const vai=id=>{location.hash=id;location.reload();};
// ---------- referências do corpo ----------
const tab=(T,y)=>{if(y>=T[0][0])return T[0][1];for(let i=1;i<T.length;i++)if(y>=T[i][0]){const f=(y-T[i][0])/(T[i-1][0]-T[i][0]);return T[i][1]+(T[i-1][1]-T[i][1])*f;}return T[T.length-1][1];};
const SZ=[[1.28,-.04],[1.05,-.08],[.8,-.15],[.5,-.14],[.25,-.08],[.05,-.09],[-.12,-.14],[-.25,-.12]]; // curvaturas da coluna
const sz=y=>tab(SZ,y);
const Sh=s=>[s*.4,1.03,-.02],El=s=>[s*.47,.47,-.04],Wr=s=>[s*.52,-.03,.03],Hd=s=>[s*.54,-.27,.05];
const Hp=s=>[s*.17,-.14,0],Kn=s=>[s*.19,-.92,.02],An=s=>[s*.2,-1.58,-.03];
const lerp=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const mid=(a,b)=>lerp(a,b,.5);
function lim(A,a,b,r,id,o){const d=A.sub(b,a),L=Math.hypot(...d);A.add(A.capsula(r,Math.max(.001,L-2*r),18),A.M(A.T(...mid(a,b)),A.alinha(d)),id,o);}
function osso(A,a,b,r,id){lim(A,a,b,r,id);A.add(A.esfera(r*1.45,0,0,18),A.T(...a),id);A.add(A.esfera(r*1.45,0,0,18),A.T(...b),id);}
function elip(A,c,r,id,o,R){A.add(A.elipsoide(r[0],r[1],r[2],30),R?A.M(A.T(...c),R):A.T(...c),id,o);}
// silhueta translúcida do corpo
function pele(A,a){
 const o={a:a===undefined?.1:a,c:[.94,.80,.70],mat:{tx:5,rel:.02,det:30,esp:.12}};
 // membro afinando, com o volume do músculo (bulge em t0, largura w) por cima do raio base
 const membro=(p,q,r0,r1,bul,t0,w,n)=>A.add(A.tubo(u=>lerp(p,q,u),u=>{const b=bul*Math.exp(-Math.pow((u-t0)/w,2));return r0+(r1-r0)*u+b;},n||36,20),A.T(0,0,0),"pele",o);
 // cabeça: crânio arredondado, rosto um pouco mais estreito e queixo
 A.add(A.param(40,30,(u,v)=>{const th=u*2*PI,ph=v*PI,y=Math.cos(ph),f=y<-.2?1-.28*Math.pow((-.2-y)/.8,1.4):1,fr=Math.sin(th)>0?1+.06*Math.sin(th):1;return [.15*Math.sin(ph)*Math.cos(th)*f,.205*y,.175*Math.sin(ph)*Math.sin(th)*f*fr];}),A.T(0,1.45,.01),"pele",o);
 for(const s of [-1,1])A.add(A.elipsoide(.018,.04,.025,14),A.T(s*.15,1.45,-.005),"pele",o);              // orelhas
 membro([0,1.3,-.01],[0,1.06,-.015],.062,.085,0,.5,.1,16);                                                 // pescoço
 const W=[[1.2,.075],[1.17,.2],[1.13,.33],[1.05,.39],[.95,.37],[.75,.31],[.5,.26],[.3,.24],[.12,.27],[.0,.31],[-.15,.33],[-.28,.28]],D=[[1.2,.065],[1.16,.1],[1.12,.12],[.95,.16],[.75,.19],[.6,.18],[.45,.16],[.25,.14],[.05,.15],[-.15,.17],[-.28,.14]];
 A.add(A.param(64,48,(u,v)=>{const y=1.2-v*1.48,th=u*2*PI,c=Math.cos(th),sn=Math.sin(th),e=.7,peito=sn>0&&y>.7&&y<.95?.025*Math.sin((y-.7)/.25*PI)*Math.pow(Math.abs(c),.3):0,gl=sn<0&&y<0&&y>-.28?.03*Math.sin(-y/.28*PI):0;
  return [tab(W,y)*Math.sign(c)*Math.abs(c)**e,y,(tab(D,y)+peito+gl)*Math.sign(sn)*Math.abs(sn)**e+.01];}),A.T(0,0,0),"pele",o);
 for(const s of [-1,1]){
  A.add(A.esfera(.07,0,0,18),A.T(...Sh(s)),"pele",o);
  membro(Sh(s),El(s),.066,.047,.012,.45,.25);                                   // braço com bíceps
  membro(El(s),Wr(s),.047,.033,.012,.22,.22);                                   // antebraço afinando para o punho
  elip(A,mid(Wr(s),Hd(s)),[.03,.085,.052],"pele",o);                            // palma
  for(let k=0;k<4;k++){const x=Hd(s)[0],z=.079-.026*k,c=mid(Wr(s),Hd(s));membro([x,c[1]-.07,c[2]-.04+z],[x+s*.006,c[1]-.16-.012*(1.5-Math.abs(k-1.5)),c[2]-.04+z],.0105,.0075,0,.5,.1,10);}
  membro([Wr(s)[0]+s*.0,Wr(s)[1]-.08,Wr(s)[2]+.06],[Wr(s)[0]+s*.02,Wr(s)[1]-.16,Wr(s)[2]+.09],.013,.009,0,.5,.1,10);   // polegar
  A.add(A.esfera(.115,0,0,18),A.T(...Hp(s)),"pele",o);
  membro(Hp(s),Kn(s),.118,.062,.012,.3,.3);                                     // coxa afinando para o joelho
  membro(Kn(s),An(s),.062,.036,.022,.28,.2);                                    // perna com a panturrilha
  A.add(A.param(30,20,(u,v)=>{const th=u*2*PI,ph=v*PI,z=Math.cos(ph),w=z>0?1-.25*z:1;return [.045*Math.sin(ph)*Math.cos(th)*w,.032*Math.sin(ph)*Math.sin(th)*(z>.2?.7:1),.13*z];}),A.T(s*.2,-1.63,.06),"pele",o);  // pé
 }
}
// ---------- sistemas ----------
const SYS={};
SYS.geral={t:"O corpo humano",f:"Os órgãos trabalham em conjunto, organizados em sistemas. Cada cor desta visão mostra um sistema. Toque num sistema da lista (ou use o controle de baixo) para abrir o sistema com todas as suas estruturas explicadas.",
 dl:[["Níveis de organização","células → tecidos → órgãos → sistemas → organismo"],["Ossos no adulto","206"],["Músculos","mais de 600"]],
 pas:"Integração entre sistemas: o oxigênio entra pelo respiratório, é levado pelo circulatório e usado na respiração celular; os nutrientes vêm do digestório; os resíduos saem pelo urinário. Nervoso e endócrino coordenam tudo.",
 cam:[[0,-.05,0],6.4,.12],
 monta(A){
  pele(A,.12);
  esqueleto(A,{a:.25,c:[.92,.88,.78]},"esqueletico",true);
  cerebro(A,"nervoso");A.poli(colunaPts(1.3,.3,.03),.014,"nervoso",{c:[.96,.82,.46]});
  coracao(A,"circulatorio");A.poli(AORTA,.022,"circulatorio",{c:[.86,.24,.22]});
  pulmoes(A,"respiratorio",.85);
  figado(A,"digestorio");estomago(A,"digestorio");intestinos(A,"digestorio");
  rins(A,"urinario");A.add(A.esfera(.065,0,0,24),A.T(0,-.17,.08),"urinario",{c:[.86,.72,.36]});
  A.add(A.elipsoide(.03,.02,.015,20),A.T(0,1.12,.08),"endocrino");elip(A,[.15,.36,-.06],[.035,.06,.03],"linfatico");
  for(const s of [-1,1])lim(A,mid(Sh(s),El(s)).map((v,i)=>v+[s*.03,0,.03][i]),El(s),.04,"muscular",{c:[.78,.30,.28]});
  elip(A,[0,-.12,.03],[.045,.06,.035],"feminino");elip(A,[.0,-.4,.07],[.04,.05,.04],"masculino",{a:0});
 },
 etq:[],
};
// ---- esquelético
const COSTELAS=[];
function colunaPts(y0,y1,dz){const P=[];for(let y=y0;y>=y1;y-=.02)P.push([0,y,sz(y)+(dz||0)]);return P;}
function esqueleto(A,o,id,simples){
 const add=(g,m,i,x)=>A.add(g,m,simples?id:i,Object.assign({},o||{},x||{}));
 const P=(i)=>simples?id:i;
 // crânio e mandíbula
 add(A.elipsoide(.15,.17,.18,40),A.T(0,1.5,-.01),"cranio");
 add(A.param(30,8,(u,v)=>{const a=-PI*.75+u*PI*1.5,r=.11+.01*v;return [r*Math.sin(a),1.33+.03*v-.04*Math.cos(a)*0,.03+r*Math.cos(a)*.95];}),A.T(0,0,0),"cranio");
 if(!simples)for(const s of [-1,1])A.add(A.esfera(.035,0,0,16),A.T(s*.06,1.48,.15),"cranio",{c:[.15,.12,.12]});
 // coluna
 for(let y=1.28;y>=-.02;y-=.052){const r=y>1.05?.026:y>.45?.03:.038;add(A.cilindro(r,.032,14),A.T(0,y,sz(y)),"coluna");if(!simples)A.add(A.cilindro(r*.95,.012,14),A.T(0,y-.026,sz(y)),"coluna",{c:[.70,.78,.86]});
  if(!simples)add(A.cone(.015,.05,8),A.M(A.T(0,y,sz(y)-.04),A.Rx(-PI/2)),"coluna");}
 add(A.cone(.06,.16,16),A.M(A.T(0,-.12,sz(-.12)),A.Rx(PI)),"coluna");
 // costelas e esterno
 for(let k=0;k<12;k++){const y=.98-k*.048,rx=.12+.13*Math.sin((k+2)/14*PI),rz=.15+.05*Math.sin((k+1)/13*PI),tm=k<7?1:k<10?.9:.55,zc=sz(y)+rz;
  for(const s of [-1,1]){const pts=[];for(let i=0;i<=24;i++){const th=i/24*PI*tm;pts.push([s*rx*Math.sin(th),y-.12*(th/PI)**1.5,zc-rz*Math.cos(th)]);}
   if(!simples||k%2===0)A.poli(pts,simples?.006:.009,P("costelas"),Object.assign({},o||{}));}}
 add(A.caixa(.05,.3,.025),A.T(0,.8,.19),"costelas");
 // cintura escapular e membros superiores
 for(const s of [-1,1]){
  if(!simples){A.poli([[s*.03,1.04,.16],[s*.18,1.07,.12],[s*.36,1.06,.02]],.014,"cintura");A.add(A.faces([[[s*.12,.97,-.2],[s*.34,1.0,-.16],[s*.18,.75,-.2]]]),A.T(0,0,0),"cintura");
   A.add(A.faces([[[s*.12,.97,-.2],[s*.18,.75,-.2],[s*.34,1.0,-.16]]]),A.T(0,0,0),"cintura");}
  if(simples){lim(A,Sh(s),El(s),.022,id,o);lim(A,El(s),Wr(s),.018,id,o);lim(A,Hp(s),Kn(s),.03,id,o);lim(A,Kn(s),An(s),.025,id,o);continue;}
  osso(A,Sh(s),El(s),.026,"umero");
  osso(A,El(s).map((v,i)=>v+[s*.012,0,.01][i]),Wr(s).map((v,i)=>v+[s*.012,0,.012][i]),.013,"antebraco");
  osso(A,El(s).map((v,i)=>v+[-s*.01,0,-.012][i]),Wr(s).map((v,i)=>v+[-s*.01,0,-.01][i]),.012,"antebraco");
  const w=Wr(s);for(let i=0;i<8;i++)A.add(A.esfera(.012,0,0,8),A.T(w[0]+s*(i%4-1.5)*.012,w[1]-.03-Math.floor(i/4)*.02,w[2]),"maos");
  for(let f=0;f<5;f++){const a=w.map((v,i)=>v+[s*(f-2)*.016,-.055,0][i]),L=f===0?.1:.17,b=a.map((v,i)=>v+[s*(f-2)*.01-(f===0?s*.03:0),-L,.01][i]);A.poli([a,lerp(a,b,.45),lerp(a,b,.72),b],.006,"maos");}
  // pelve, membros inferiores
  A.add(A.param(30,20,(u,v)=>{const a=u*PI*1.1-PI*.05,b=v*PI;return [s*(.06+.13*Math.sin(b)*Math.cos(a*.5)),-.02+.12*Math.cos(b),-.03+.1*Math.sin(b)*Math.sin(a)*.6];}),A.T(0,0,0),"pelve");
  A.poli([[s*.17,-.12,.0],[s*.12,-.2,.08],[s*.02,-.22,.1]],.022,"pelve");
  A.add(A.esfera(.04,0,0,16),A.T(...Hp(s)),"femur");A.poli([Hp(s),[s*.22,-.17,0]],.024,"femur");osso(A,[s*.22,-.17,0],Kn(s),.028,"femur");
  A.add(A.elipsoide(.03,.035,.015,16),A.T(Kn(s)[0],Kn(s)[1],.08),"patela");
  osso(A,Kn(s),An(s),.026,"perna");osso(A,Kn(s).map((v,i)=>v+[s*.035,-.04,-.02][i]),An(s).map((v,i)=>v+[s*.03,.02,-.02][i]),.011,"perna");
  const a=An(s);A.add(A.elipsoide(.035,.03,.05,16),A.T(a[0],a[1]-.04,a[2]-.02),"pes");for(let f=0;f<5;f++)A.poli([[a[0]+s*(f-2)*.014,a[1]-.06,a[2]+.02],[a[0]+s*(f-2)*.02,a[1]-.09,a[2]+.17]],.007,"pes");
 }
}
SYS.esqueletico={t:"Sistema esquelético",f:"Conjunto de ossos, cartilagens e articulações. Sustenta o corpo, protege órgãos (crânio protege o encéfalo; costelas, coração e pulmões), serve de alavanca para os músculos, guarda cálcio e fósforo e produz células do sangue na medula óssea vermelha.",
 dl:[["Ossos no adulto","206 (o bebê nasce com cerca de 300, que se fundem)"],["Esqueleto axial","crânio, coluna, costelas e esterno"],["Esqueleto apendicular","membros e cinturas"],["Tecido","ósseo: matriz de colágeno + fosfato de cálcio"]],
 pas:"Funções do esqueleto, tipos de articulação, células ósseas (osteoblastos formam, osteoclastos reabsorvem) e a relação com cálcio e vitamina D (raquitismo, osteoporose).",
 cam:[[0,-.05,0],6.4,.1],
 partes:[["cranio","Crânio",[.92,.88,.80],"Caixa óssea formada por ossos unidos por suturas (articulações imóveis). Protege o encéfalo. A mandíbula é o único osso móvel da cabeça.","Moleira do bebê: os ossos ainda não se fundiram (fontanelas)."],
  ["coluna","Coluna vertebral",[.90,.86,.76],"33 vértebras (7 cervicais, 12 torácicas, 5 lombares, sacro e cóccix) com discos de cartilagem entre elas, que amortecem. Protege a medula espinal, que passa por dentro.","As curvaturas naturais (lordoses e cifose) distribuem o peso; desvios laterais são escoliose."],
  ["costelas","Costelas e esterno (caixa torácica)",[.94,.90,.82],"12 pares de costelas presas à coluna. As 7 primeiras ligam-se direto ao esterno (verdadeiras), as 3 seguintes por cartilagem (falsas) e as 2 últimas ficam soltas na frente (flutuantes). Protegem coração e pulmões e participam da respiração.","Na inspiração, os músculos intercostais elevam as costelas e aumentam o volume do tórax."],
  ["cintura","Clavículas e escápulas",[.90,.84,.74],"Formam a cintura escapular, que prende os braços ao tronco. A clavícula liga o esterno ao ombro; a escápula (omoplata) fica nas costas.","Fratura de clavícula é uma das mais comuns."],
  ["umero","Úmero",[.92,.88,.78],"Osso do braço, entre o ombro e o cotovelo.","Ossos longos: medula amarela (gordura) no canal central e vermelha nas pontas."],
  ["antebraco","Rádio e ulna",[.92,.88,.78],"Ossos do antebraço. O rádio fica do lado do polegar e gira em volta da ulna para virar a palma da mão.","Articulação do cotovelo: tipo dobradiça."],
  ["maos","Mãos",[.92,.88,.78],"27 ossos em cada mão: carpos (punho), metacarpos (palma) e falanges (dedos).","O polegar opositor permite a pinça fina."],
  ["pelve","Pelve (quadril)",[.90,.86,.76],"Ossos do quadril unidos ao sacro. Sustentam o peso do tronco e protegem órgãos do baixo abdome. Na mulher é mais larga, adaptada ao parto.","Diferença da pelve masculina e feminina."],
  ["femur","Fêmur",[.94,.90,.80],"Osso da coxa, o maior e mais resistente do corpo. A cabeça do fêmur encaixa na pelve (articulação do quadril, tipo esfera).","Maior osso do corpo humano."],
  ["patela","Patela",[.94,.90,.82],"Pequeno osso na frente do joelho, dentro do tendão do quadríceps. Protege a articulação e melhora a alavanca da perna.","Antigo nome: rótula."],
  ["perna","Tíbia e fíbula",[.92,.88,.78],"Ossos da perna. A tíbia (canela) sustenta o peso; a fíbula, mais fina, fica do lado de fora.","A tíbia fica logo abaixo da pele, por isso pancadas na canela doem tanto."],
  ["pes","Pés",[.92,.88,.78],"26 ossos em cada pé: tarsos (incluindo o calcanhar), metatarsos e falanges. Formam arcos que amortecem o impacto.","Pé chato: arco plantar rebaixado."]],
 monta(A){pele(A,.07);esqueleto(A);},
 etq:[["cranio",[0,1.72,0],"Crânio"],["coluna",[.08,.2,-.1],"Coluna"],["costelas",[-.33,.72,.1],"Costelas"],["femur",[.32,-.5,0],"Fêmur"],["pelve",[-.3,-.02,0],"Pelve"],["umero",[-.55,.75,0],"Úmero"]],
};
// ---- muscular
SYS.muscular={t:"Sistema muscular",f:"Mais de 600 músculos esqueléticos, presos aos ossos por tendões, produzem os movimentos ao se contrair. A contração acontece quando os filamentos de actina deslizam sobre os de miosina, usando ATP e íons cálcio. Os músculos trabalham em pares: quando um contrai, o oposto relaxa.",
 dl:[["Estriado esquelético","voluntário, preso aos ossos"],["Estriado cardíaco","involuntário, só no coração"],["Liso","involuntário, nas paredes de órgãos e vasos"],["Energia","ATP; em esforço intenso, fermentação lática"]],
 pas:"Tipos de tecido muscular, mecanismo de contração (actina, miosina, Ca²⁺, ATP), músculos antagônicos e a fadiga muscular.",
 cam:[[0,-.05,0],6.4,.1],
 partes:[["cabeca","Esternocleidomastóideo e trapézio",[.80,.32,.30],"O esternocleidomastóideo gira e inclina a cabeça; o trapézio, nas costas, eleva os ombros e segura a escápula.","Músculos do pescoço e da postura."],
  ["deltoide","Deltoide",[.78,.30,.28],"Cobre o ombro e levanta o braço para o lado, para a frente e para trás.","Local comum de injeção intramuscular."],
  ["peitoral","Peitoral maior",[.76,.28,.26],"Músculo do peito que puxa o braço para a frente e para o meio do corpo.","Trabalha em flexões e supino."],
  ["biceps","Bíceps e tríceps",[.80,.32,.28],"O bíceps (na frente do braço) dobra o cotovelo; o tríceps (atrás) estica. São o exemplo clássico de músculos antagônicos.","Músculos antagônicos: um contrai enquanto o outro relaxa."],
  ["antebraco","Músculos do antebraço",[.76,.30,.28],"Movem o punho e os dedos através de tendões longos que passam pelo punho.","Tendinite por esforço repetitivo (LER)."],
  ["abdome","Reto abdominal e oblíquos",[.78,.32,.30],"Seguram os órgãos do abdome, flexionam e giram o tronco e ajudam na expiração forçada, na tosse e no parto.","O 'tanquinho' é o reto abdominal dividido por faixas de tendão."],
  ["gluteo","Glúteo máximo",[.74,.28,.26],"Maior músculo do corpo. Estende o quadril: levantar da cadeira, subir escadas, correr.","Maior músculo do corpo humano."],
  ["quadriceps","Quadríceps e posteriores da coxa",[.80,.32,.28],"O quadríceps (frente) estende o joelho; os posteriores (isquiotibiais) dobram o joelho.","Mais um par antagônico."],
  ["panturrilha","Panturrilha e tibial anterior",[.78,.30,.28],"O gastrocnêmio (panturrilha) levanta o calcanhar e se prende pelo tendão de Aquiles; o tibial anterior levanta a ponta do pé.","Tendão calcâneo (de Aquiles): o mais forte do corpo."],
  ["diafragma","Diafragma",[.84,.40,.36],"Músculo em forma de cúpula que separa tórax e abdome. É o principal músculo da respiração: ao contrair, desce e o ar entra.","Soluço é uma contração involuntária do diafragma."]],
 monta(A){
  pele(A,.08);esqueleto(A,{a:.25,c:[.92,.88,.78]},"osso",true);
  const o={},R=A.rnd(4);
  for(const s of [-1,1]){
