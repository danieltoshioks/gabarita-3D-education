<script>
// modelo de Dalton (1808): esferas maciças e indivisíveis; cada elemento tem o seu tipo de átomo
Modelo3D({
 titulo:"Modelo de Dalton", area:"Química", voltar:"index.html#quimica", rotLista:"Partes", rotParte:"Parte",
 geral:{t:"Modelo de Dalton (1808)",f:"John Dalton retomou a ideia grega de átomo e a apoiou em experimentos com as massas das substâncias. Para ele, o átomo era uma esfera maciça, indivisível e indestrutível, como uma bola de bilhar. Átomos do mesmo elemento são iguais; de elementos diferentes, têm massas diferentes.",
  dl:[["Quem","John Dalton, 1808"],["Apelido","bola de bilhar"],["Base","leis ponderais (Lavoisier e Proust)"],["Limite","não explica a eletricidade da matéria"]],
  pas:"Evolução dos modelos atômicos e as leis ponderais: conservação da massa (Lavoisier) e proporções definidas (Proust)."},
 partes:[
  {id:"atomo",n:"Átomo maciço",c:[.62,.64,.70],f:"Esfera sólida, sem partes internas e impossível de dividir. Nas reações, os átomos não são criados nem destruídos: só se reorganizam.",pas:"É por isso que a massa se conserva numa reação em sistema fechado."},
  {id:"outros",n:"Átomos de outros elementos",c:[.80,.42,.34],f:"Cada elemento tem um tipo de átomo, com massa e tamanho próprios. Dalton representava cada um com um símbolo circular diferente.",pas:"Substância simples (um tipo de átomo) × composta (átomos diferentes em proporção fixa)."},
  {id:"composto",n:"Combinação de átomos",c:[.90,.92,.96],f:"Átomos se unem em proporções de números inteiros e simples para formar as substâncias compostas.",pas:"Lei das proporções definidas: a água sempre tem a mesma proporção em massa de hidrogênio e oxigênio."},
 ],
 detalhe:{atomo:6,outros:6,composto:6}, relevo:{atomo:.012,outros:.012,composto:.012}, brilho:{atomo:.8,outros:.8,composto:.8},
 aoRaio:0, fundo:["#1A2240","#0A0F22"], dist:6.2, pitch:.3, giro:.002, botoes:{corte:false},
 constroi(A){
  const {add,esfera,T}=A;
  add(esfera(.8,0,0,72),T(0,0,0),"atomo");
  add(esfera(.42,0,0,56),T(1.55,-.2,.3),"outros");
  add(esfera(.55,0,0,56),T(-1.6,-.15,.35),"outros",{c:[.24,.24,.27]});
  // "água" na visão de Dalton: um H + um O (ele achava que era HO)
  add(esfera(.32,0,0,48),T(.05,-.55,1.25),"composto",{c:[.86,.36,.30]});
  add(esfera(.2,0,0,40),T(.45,-.6,1.25),"composto");
 },
 foco:{atomo:[[0,0,0],2.6,[0,.3,1]],outros:[[1.55,-.2,.3],1.8,[.5,.3,1]],composto:[[.2,-.55,1.25],1.4,[0,.4,1]]},
 etiquetas:[{id:"atomo",p:[0,.95,0],t:"Átomo"},{id:"outros",p:[1.55,.35,.3],t:"Outro elemento"},{id:"composto",p:[.2,-.1,1.25],t:"Composto"}],
});
